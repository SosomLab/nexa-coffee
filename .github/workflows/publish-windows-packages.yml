# publish-windows-packages — winget · Chocolatey 제출 (이식 원본: nexa-clip · 변수+시크릿 이중 게이트 + 검수 대기 자동 판정)
#
# | 채널 | 스위치 변수 | 시크릿 | 대기 판정 |
# | winget | vars.WINGET_PUBLISH=true | WINGET_TOKEN | microsoft/winget-pkgs에 SosomLab.NexaCoffee 열린 PR이 있으면 대기 |
# | Chocolatey | vars.CHOCO_PUSH=true | CHOCO_API_KEY | 공개 피드에 직전 릴리스 버전이 아직 없으면 대기(모더레이션 중) |
#
# `channels`로 한 채널만 고를 수 있다(both·choco·winget). 모더레이션 지적을 고쳐 같은 버전을 다시 올릴 때 쓴다 —
# 예: choco 수정 재push는 `channels=choco force=true`(force가 없으면 첫 제출이 대기 중이라 건너뛴다).
name: publish-windows-packages

on:
  workflow_call:
    inputs:
      tag: { required: true, type: string }
      force: { required: false, default: false, type: boolean }
      channels: { required: false, default: both, type: string }
  workflow_dispatch:
    inputs:
      tag: { description: "릴리스 태그(예: v0.1.0)", required: true, type: string }
      force: { description: "검수 대기 판정을 무시하고 제출", required: false, default: false, type: boolean }
      # 재제출은 보통 한 채널만 필요하다 — choco 모더레이션 수정 재push 때 winget PR이 덩달아 또 열리면 안 된다.
      channels: { description: "제출 채널", required: false, default: both, type: choice, options: [both, choco, winget] }

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      winget_go: ${{ steps.winget.outputs.go }}
      choco_go: ${{ steps.choco.outputs.go }}
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 스위치 상태(값 노출 없음)
        run: |
          echo "태그: ${{ inputs.tag }} (force=${{ inputs.force }})"
          echo "vars.WINGET_PUBLISH='${{ vars.WINGET_PUBLISH }}' · WINGET_TOKEN 설정됨: ${{ env.WINGET_TOKEN != '' }}"
          echo "vars.CHOCO_PUSH='${{ vars.CHOCO_PUSH }}' · CHOCO_API_KEY 설정됨: ${{ env.CHOCO_API_KEY != '' }}"
      - id: winget
        shell: bash
        run: |
          set -euo pipefail
          go=false
          ch="${{ inputs.channels || 'both' }}"
          if [ "$ch" != "both" ] && [ "$ch" != "winget" ]; then
            echo "::notice::winget: channels=$ch — 건너뛴다."
          elif [ "${{ vars.WINGET_PUBLISH }}" = "true" ] && [ -n "${WINGET_TOKEN:-}" ]; then
            go=true
            if [ "${{ inputs.force }}" != "true" ]; then
              me=$(GH_TOKEN="$WINGET_TOKEN" gh api user -q .login)
              open=$(GH_TOKEN="$WINGET_TOKEN" gh pr list -R microsoft/winget-pkgs --state open --author "$me" \
                       --search "SosomLab.NexaCoffee" --json number,title -q '.[] | "#\(.number) \(.title)"' || true)
              if [ -n "$open" ]; then echo "::warning::winget: 직전 제출이 검수 대기 중 — 건너뛴다."; echo "$open"; go=false; fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "winget 제출: $go"
      - id: choco
        shell: bash
        run: |
          set -euo pipefail
          go=false
          ch="${{ inputs.channels || 'both' }}"
          if [ "$ch" != "both" ] && [ "$ch" != "choco" ]; then
            echo "::notice::choco: channels=$ch — 건너뛴다."
          elif [ "${{ vars.CHOCO_PUSH }}" = "true" ] && [ -n "${CHOCO_API_KEY:-}" ]; then
            go=true
            if [ "${{ inputs.force }}" != "true" ]; then
              cur="${{ inputs.tag }}"
              prev=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | grep -vx "$cur" | head -1 || true)
              if [ -n "$prev" ]; then
                pv="${prev#v}"
                url="https://community.chocolatey.org/api/v2/Packages()?\$filter=Id%20eq%20'nexa-coffee'%20and%20Version%20eq%20'$pv'"
                # ⚠️ 피드는 **미승인 버전도 <entry>로 돌려준다**(IsApproved=false · PackageStatus=Submitted).
                # 09-17: <entry> 유무로 봤다가 0.1.0 모더레이션 중인데 0.1.1을 밀어 403을 받았다. 승인 여부로 판정한다.
                if ! curl -fsS "$url" | grep -q '<d:IsApproved m:type="Edm.Boolean">true</d:IsApproved>'; then
                  echo "::warning::choco: nexa-coffee $pv 이(가) 아직 승인되지 않았다(모더레이션 대기) — 건너뛴다."; go=false
                fi
              else
                echo "직전 정식 태그 없음 — 첫 제출."
              fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "choco 제출: $go"

  chocolatey:
    needs: guard
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p assets && gh release download "${{ inputs.tag }}" --dir assets --pattern 'nexa-coffee-*'
      - name: 매니페스트 생성 + pack
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          v="${TAG#v}"
          ./packaging/render-manifests.sh "$v" assets out
          mkdir -p out/choco/nupkg
          choco pack out/choco/nexa-coffee/nexa-coffee.nuspec --version "$v" --outputdirectory out/choco/nupkg
          ls -l out/choco/nupkg
      - uses: actions/upload-artifact@v4
        with: { name: "chocolatey-${{ inputs.tag }}", path: out/choco/** }
      - name: choco push
        if: needs.guard.outputs.choco_go == 'true'
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          choco push "out/choco/nupkg/nexa-coffee.${TAG#v}.nupkg" --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"
          echo "제출 완료 — 커뮤니티 저장소는 검수를 거쳐야 노출된다."
      - if: needs.guard.outputs.choco_go != 'true'
        shell: bash
        run: echo "::notice::choco push하지 않았다(스위치 꺼짐·키 없음·직전 제출 검수 대기). 아티팩트의 nupkg를 직접 push할 수 있다."

  winget:
    needs: guard
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p assets && gh release download "${{ inputs.tag }}" --dir assets --pattern 'nexa-coffee-*'
      - name: 매니페스트 생성 + 검증
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          ./packaging/render-manifests.sh "${TAG#v}" assets out
          d=$(find out/winget -name '*.installer.yaml' -exec dirname {} \; | head -1)
          echo "== $d · winget $(winget --version)"
          # `winget validate`는 경고만 있어도 **exit 40**으로 끝난다 — 40은 실패가 아니므로 기록만 남기고 넘어간다.
          # 09-17: 러너의 winget이 우리 ManifestVersion(1.12.0)보다 오래돼 스키마 헤더를 "예상 패턴과 다르다"고 본다
          # (같은 파일이 로컬 winget 1.29에서는 경고 없이 통과 · PR #433980의 komac 매니페스트도 같은 URL을 쓴다).
          set +e; v_out=$(winget validate --manifest "$d" 2>&1); rc=$?; set -e
          echo "$v_out"
          case "$rc" in
            0)  ;;
            40) echo "::warning::winget validate 경고(exit 40) — 위 내용 확인" ;;
            *)  echo "::error::winget validate 실패(exit $rc)"; exit "$rc" ;;
          esac
      - uses: actions/upload-artifact@v4
        with: { name: "winget-${{ inputs.tag }}", path: out/winget/** }
      - name: winget-pkgs PR
        if: needs.guard.outputs.winget_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl.exe -L -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          d=$(find out/winget -name '*.installer.yaml' -exec dirname {} \; | head -1)
          # 09-13 첫 릴리스: GitHub API 일시 장애로 "Failed to connect to GitHub" → 3회 재시도(간격 60초). 그래도 실패하면
          # 로컬에서 `komac submit <매니페스트 폴더> --yes`로 제출할 수 있다(0.1.0은 그렇게 PR #433980을 만들었다).
          for i in 1 2 3; do
            if ./wingetcreate.exe submit --token "$WINGET_TOKEN" "$d"; then echo "PR 생성 — microsoft/winget-pkgs의 자동 검증·리뷰를 거쳐야 노출된다."; exit 0; fi
            echo "::warning::wingetcreate submit 실패($i/3) — 60초 뒤 재시도"; sleep 60
          done
          exit 1
      - if: needs.guard.outputs.winget_go != 'true'
        shell: bash
        run: echo "::notice::winget PR을 만들지 않았다(스위치 꺼짐·토큰 없음·직전 제출 검수 대기). 아티팩트를 직접 PR할 수 있다."
