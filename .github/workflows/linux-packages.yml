# linux-packages — 공개된 릴리스의 Linux tar.gz 바이너리를 .deb · .rpm으로 포장해 같은 릴리스에 올리고,
# SosomLab Linux 패키지 저장소(pkg.sosomlab.com · APT + RPM)에 반영하라는 신호를 보낸다(이식 원본: nexa-sql linux-repo.yml).
#
# 저장소 = SosomLab/linux-repo(등록 파일 `apps/nexa-coffee.toml` · 패키지 파일은 싣지 않고 이 저장소의 Release 자산으로 302).
# 실행 시점 = release.yml이 릴리스 공개 뒤 부른다(workflow_call) · 수동(workflow_dispatch)으로 기존 태그에 덧붙일 수도 있다.
#   release.yml의 GITHUB_TOKEN 공개는 `release: published` 이벤트를 다른 워크플로에 보내지 않아서 nexa-sql처럼 이벤트로 받지 않는다.
# 바이너리 = 릴리스 tar.gz 안의 것 그대로(같은 바이트) · 포장 = packaging/linux/build-pkgs.sh.
# ⚠ 한 번 올린 Release 자산은 지우거나 다시 올리지 않는다 — 서명된 색인의 해시가 그 파일을 가리킨다(이미 있으면 올리기를 건너뛴다).
# `LINUX_REPO_DISPATCH_TOKEN`(fine-grained · SosomLab/linux-repo Contents Read/write)이 없으면 알림만 남긴다 — linux-repo 정기 실행(하루 1회)이 잡는다.
name: linux-packages

on:
  workflow_call:
    inputs:
      tag: { required: true, type: string }
  workflow_dispatch:
    inputs:
      tag: { description: "릴리스 태그(예: v0.1.0)", required: true, type: string }

permissions:
  contents: write

jobs:
  deb-rpm:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: 사전 릴리스 거르기
        run: |
          case "$TAG" in *-*) echo "::notice::사전 릴리스($TAG)는 Linux 저장소에 올리지 않는다"; echo "SKIP=1" >> "$GITHUB_ENV" ;; esac
      - name: 포장(.deb · .rpm)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          V="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir assets --pattern "nexa-coffee-$V-linux-x64.tar.gz"
          tar -C assets -xzf "assets/nexa-coffee-$V-linux-x64.tar.gz"
          sh packaging/linux/build-pkgs.sh "assets/nexa-coffee-$V-linux-x64/nexa-coffee" "$V" out
          (cd out && sha256sum *) | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 설치 스모크(dpkg -i → 파일 확인 → dpkg -r)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          sudo dpkg -i out/*.deb
          test -x /usr/bin/nexa-coffee && dpkg -L nexa-coffee
          sudo dpkg -r nexa-coffee
          test ! -e /usr/bin/nexa-coffee
      - name: 릴리스에 올리기(이미 있으면 건너뜀)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          have=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for f in out/*.deb out/*.rpm; do
            n=$(basename "$f")
            if echo "$have" | grep -qx "$n"; then echo "::notice::$n 이미 있음 — 다시 올리지 않는다"; else gh release upload "$TAG" "$f" -R "$GITHUB_REPOSITORY"; fi
          done
      - name: pkg.sosomlab.com 갱신 신호
        if: env.SKIP != '1'
        env:
          TOKEN: ${{ secrets.LINUX_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # 스텝 `if:`에서는 secrets를 읽을 수 없다 — 토큰 유무는 셸에서 본다.
          if [ -z "$TOKEN" ]; then echo "::notice::LINUX_REPO_DISPATCH_TOKEN 없음 — linux-repo 정기 실행(하루 한 번)이 반영한다"; exit 0; fi
          curl -fsS -X POST https://api.github.com/repos/SosomLab/linux-repo/dispatches \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"app-released\",\"client_payload\":{\"app\":\"nexa-coffee\",\"tag\":\"$TAG\",\"repo\":\"$GITHUB_REPOSITORY\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}}"
          echo "신호 보냄 — https://github.com/SosomLab/linux-repo/actions 의 publish 실행을 본다" | tee -a "$GITHUB_STEP_SUMMARY"
