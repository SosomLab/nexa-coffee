# release — `v*` 태그 push → 5 산출물 + SHA256SUMS + GitHub Release 공개. (nexa-shortcut/nexa-clip 정책 계승)
# 산출물: macOS universal .app zip · Windows 설치본 setup.exe(NSIS · DR-16) + 포터블 x64/x86 -portable.zip(mingw · 10-17 분리) · Linux x64 tar.gz(musl 정적).
# 릴리스 공개 뒤 homebrew.yml(탭 갱신) · publish-windows-packages.yml(winget PR · choco push) · linux-packages.yml(.deb·.rpm → pkg.sosomlab.com)을 이어서 부른다.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) version="${tag#v}" ;; *) version="0.0.0-dev.${GITHUB_SHA::7}" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$(cat VERSION)" = "$version" ] || { echo "::error::태그 $version ≠ VERSION $(cat VERSION)"; exit 1; }
          fi

  linux-windows:
    needs: meta
    runs-on: ubuntu-latest
    env: { VERSION: "${{ needs.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools dbus gcc-mingw-w64 zip
      - run: make test && make static && sh scripts/linux-smoke.sh dist/nexa-coffee && make win
      - name: 포장
        run: |
          set -e
          # tar 최상위 = nexa-coffee-<v>-linux-x64/ (brew formula가 그 안을 본다)
          mkdir -p "out/nexa-coffee-$VERSION-linux-x64"
          cp dist/nexa-coffee packaging/linux/nexa-coffee.desktop packaging/linux/install.sh packaging/linux/uninstall.sh packaging/branding/nexa-coffee-256.png LICENSE "out/nexa-coffee-$VERSION-linux-x64/"
          tar -C out -czf "out/nexa-coffee-$VERSION-linux-x64.tar.gz" "nexa-coffee-$VERSION-linux-x64"
          rm -rf "out/nexa-coffee-$VERSION-linux-x64"
          # 포터블 zip(설치본과 별도 자산 · 10-17) — 루트에 exe + LICENSE(-j: 경로 없이).
          # winget SosomLab.NexaCoffee.Portable(NestedInstallerFiles) · choco nexa-coffee-portable(unzip)이 루트 기준으로 본다.
          zip -9 -j "out/nexa-coffee-$VERSION-windows-x64-portable.zip" dist/nexa-coffee-x64.exe LICENSE
          zip -9 -j "out/nexa-coffee-$VERSION-windows-x86-portable.zip" dist/nexa-coffee-x86.exe LICENSE
          ls -la out/
      - uses: actions/upload-artifact@v6
        with: { name: out-linux-windows, path: out/* }
      # 설치본 재료 — windows-setup 잡이 받는다. 이름이 out-* 가 아니라 publish 가 릴리스 자산으로 올리지 않는다.
      - uses: actions/upload-artifact@v6
        with:
          name: win-exe
          path: |
            dist/nexa-coffee-x64.exe
            dist/nexa-coffee-x86.exe

  # Windows 설치본(NSIS · x64/x86 exe를 담은 setup.exe 하나) — **Windows 러너 + 공식 NSIS**(11-18).
  # Ubuntu apt NSIS(3.10 Debian 빌드)로 만든 0.1.5 설치본이 Defender·VirusTotal 오탐에 걸렸다(build-setup.sh 머리말 · docs/19).
  windows-setup:
    needs: [meta, linux-windows]
    runs-on: windows-latest
    env: { VERSION: "${{ needs.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: { name: win-exe, path: dist }
      - name: NSIS(러너에 없으면 설치)
        shell: bash
        run: |
          [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] || command -v makensis >/dev/null 2>&1 || choco install nsis -y --no-progress
      - name: Windows 설치본(공식 NSIS)
        shell: bash
        run: sh packaging/windows/build-setup.sh "$VERSION" dist out
      - uses: actions/upload-artifact@v6
        with: { name: out-windows-setup, path: out/* }

  macos:
    needs: meta
    runs-on: macos-latest
    env: { VERSION: "${{ needs.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@v5
      - run: make test && make && make app
      - name: 포장
        run: |
          mkdir -p out && cp LICENSE dist/ && cd dist && zip -9 -r -y "../out/nexa-coffee-$VERSION-macos-universal.zip" "Nexa Coffee.app" LICENSE
      - uses: actions/upload-artifact@v6
        with: { name: out-macos, path: out/* }

  publish:
    needs: [meta, linux-windows, windows-setup, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { pattern: "out-*", path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # 릴리스 본문 = docs/releases/<태그>.md(있으면) + 공통 안내. PR 없이 main에 바로 커밋하는 저장소라
      # generate_release_notes만으로는 비교 링크 한 줄뿐이다 — 무엇이 바뀌었는지는 사람이 쓴 노트로 남긴다.
      - uses: actions/checkout@v5
        with: { sparse-checkout: docs/releases, path: src }
      - name: 릴리스 본문
        run: |
          f="src/docs/releases/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$f" ]; then cat "$f"; echo; else echo "::warning::$f 없음 — 공통 안내만 싣는다" >&2; fi
            echo '⚠️ v1은 코드 서명이 없습니다 — macOS Gatekeeper("확인되지 않은 개발자")·Windows SmartScreen 경고가 뜹니다.'
            echo 'macOS: `xattr -dr com.apple.quarantine "Nexa Coffee.app"` 후 실행. 무결성은 `SHA256SUMS.txt`로 확인하세요.'
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*
          generate_release_notes: true
          body_path: notes.md

  # ── 패키지 관리자(릴리스 공개 뒤 · 태그일 때만) ──
  homebrew:
    needs: [meta, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  windows-packages:
    needs: [meta, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-windows-packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  linux-packages:
    needs: [meta, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/linux-packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
