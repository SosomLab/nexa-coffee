# release — `v*` 태그 push → 5 산출물 + SHA256SUMS + GitHub Release 공개. (nexa-shortcut/nexa-clip 정책 계승)
# 산출물: macOS universal .app zip · Windows x64/x86 zip(mingw) · Linux x64 tar.gz(musl 정적).
# 패키지 관리자(brew/winget/choco) 제출은 packaging/ 템플릿으로 후속(docs/TODO).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) version="${tag#v}" ;; *) version="0.0.0-dev.${GITHUB_SHA::7}" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$(cat VERSION)" = "$version" ] || { echo "::error::태그 $version ≠ VERSION $(cat VERSION)"; exit 1; }
          fi

  linux-windows:
    needs: meta
    runs-on: ubuntu-latest
    env: { VERSION: "${{ needs.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools dbus gcc-mingw-w64 zip
      - run: make test && make static && sh scripts/linux-smoke.sh dist/nexa-coffee && make win
      - name: 포장
        run: |
          set -e
          mkdir -p out/linux
          cp dist/nexa-coffee packaging/linux/nexa-coffee.desktop packaging/linux/install.sh packaging/linux/uninstall.sh packaging/branding/nexa-coffee-256.png LICENSE out/linux/
          tar -C out -czf "out/nexa-coffee-$VERSION-linux-x64.tar.gz" linux
          (cd dist && zip -9 "../out/nexa-coffee-$VERSION-windows-x64.zip" nexa-coffee-x64.exe ../LICENSE)
          (cd dist && zip -9 "../out/nexa-coffee-$VERSION-windows-x86.zip" nexa-coffee-x86.exe ../LICENSE)
          rm -rf out/linux
      - uses: actions/upload-artifact@v4
        with: { name: out-linux-windows, path: out/* }

  macos:
    needs: meta
    runs-on: macos-latest
    env: { VERSION: "${{ needs.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
      - run: make test && make && make app
      - name: 포장
        run: |
          mkdir -p out && cd dist && zip -9 -r -y "../out/nexa-coffee-$VERSION-macos-universal.zip" "Nexa Coffee.app" ../LICENSE
      - uses: actions/upload-artifact@v4
        with: { name: out-macos, path: out/* }

  publish:
    needs: [meta, linux-windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ⚠️ v1은 코드 서명이 없습니다 — macOS Gatekeeper("확인되지 않은 개발자")·Windows SmartScreen 경고가 뜹니다.
            macOS: `xattr -dr com.apple.quarantine "Nexa Coffee.app"` 후 실행. 무결성은 `SHA256SUMS.txt`로 확인하세요.
