# CI — "main은 항상 green"(docs/16). 3-OS 빌드 + 코어 테스트 + Linux D-Bus 스모크 + 크기 예산.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 도구
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools dbus gcc-mingw-w64 nsis
      - name: 코어 테스트
        run: make test
      - name: Linux 정적(musl) 빌드
        run: make static
      - name: Linux D-Bus 스모크(세션 버스 · SNI · dbusmenu · 클릭)
        run: sh scripts/linux-smoke.sh dist/nexa-coffee
      - name: Linux 설치 스크립트(install.sh · uninstall.sh · --autostart · 아이콘 캐시)
        run: sh scripts/test-install.sh dist/nexa-coffee
      - name: Windows 크로스 빌드(mingw · CRT 미링크)
        run: make win
      - name: Windows 설치본 스크립트 컴파일(NSIS · release.yml과 같은 치환)
        run: |
          set -e
          mkdir -p build/nsis
          cp dist/nexa-coffee-x64.exe dist/nexa-coffee-x86.exe packaging/branding/nexa-coffee.ico LICENSE build/nsis/
          v=$(cat VERSION)
          sed -e "s/@VERSION@/$v/g" -e "s/@VIVERSION@/$v.0/g" packaging/windows/installer.nsi > build/nsis/installer.nsi
          makensis -V2 -INPUTCHARSET UTF8 build/nsis/installer.nsi
          ls -la "build/nsis/nexa-coffee-$v-windows-setup.exe"
      - name: 패키지 매니페스트 렌더링(설치본·포터블 winget/choco · brew — 릴리스 자산 이름 그대로)
        run: |
          set -e
          v=$(cat VERSION); a=build/assets; rm -rf "$a" build/manifests; mkdir -p "$a"
          cp "build/nsis/nexa-coffee-$v-windows-setup.exe" "$a/"
          for f in windows-x64-portable.zip windows-x86-portable.zip macos-universal.zip linux-x64.tar.gz; do echo "$f" > "$a/nexa-coffee-$v-$f"; done
          bash packaging/render-manifests.sh "$v" "$a" build/manifests
          for p in SosomLab/NexaCoffee/$v/SosomLab.NexaCoffee SosomLab/NexaCoffee/Portable/$v/SosomLab.NexaCoffee.Portable; do
            ls "build/manifests/winget/manifests/s/$p.installer.yaml" >/dev/null
          done
          ls build/manifests/choco/nexa-coffee/nexa-coffee.nuspec build/manifests/choco/nexa-coffee-portable/nexa-coffee-portable.nuspec
      - name: 크기 예산(초경량 회귀 검사)
        run: |
          set -e
          ls -la dist/
          for f in dist/nexa-coffee-x64.exe dist/nexa-coffee-x86.exe; do
            s=$(stat -c%s "$f"); [ "$s" -le 65536 ] || { echo "::error::$f = $s bytes > 64KB"; exit 1; }
          done
          s=$(stat -c%s dist/nexa-coffee); [ "$s" -le 131072 ] || { echo "::error::linux static = $s bytes > 128KB"; exit 1; }
      - uses: actions/upload-artifact@v6
        with: { name: linux-and-windows, path: dist/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: 코어 테스트
        run: make test
      - name: 유니버설 빌드 + .app
        run: make && make app
      - name: 크기 예산
        run: |
          s=$(stat -f%z dist/nexa-coffee); [ "$s" -le 262144 ] || { echo "::error::macOS universal = $s bytes > 256KB"; exit 1; }
      - uses: actions/upload-artifact@v6
        with: { name: macos, path: "dist/Nexa Coffee.app" }

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: MSVC 네이티브 빌드(CRT 미링크)
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v6
        with: { name: windows-msvc, path: dist/nexa-coffee-x64.exe }
