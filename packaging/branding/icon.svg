<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Nexa Coffee">
  <!--
    Nexa Coffee 앱 아이콘 (SSOT · tools/gen-icon.py 가 생성 — 손으로 고치지 말 것)
    - SosomLab "Nexa" 계열: 풀블리드 라운드 스퀘어 배경(rx 232/1024) · 세로 그라디언트 · 흰 전경.
    - 모티프: 타이머 링 — 1/3 실선(시간) · 2/9 옅은 실선(분) · 4/9 점선(초 = 흘러가는 순간들).
      트레이의 대기 아이콘(src/core/icon_idle.c)이 같은 모양을 단색으로 그린다.
    - 색: 커피 앰버 #F0A24B → #B5561B — beep 파랑·clip 청록·dir2 초록과 한눈에 구분.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0A24B"/>
      <stop offset="1" stop-color="#B5561B"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <!-- ① 1/3 실선 -->
  <path d="M532.6 216.7 A296 296 0 0 1 778.0 641.8" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" opacity="1.0"/>
  <!-- ② 남은 길이의 1/3 — 옅은 실선 -->
  <path d="M757.4 677.5 A296 296 0 0 1 430.4 796.5" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" opacity="0.55"/>
  <!-- ③ 나머지 — 완전한 원 4개 -->
  <circle cx="293.8" cy="712.0" r="48.0" fill="#FFFFFF"/>
  <circle cx="218.5" cy="550.6" r="48.0" fill="#FFFFFF"/>
  <circle cx="249.4" cy="375.3" r="48.0" fill="#FFFFFF"/>
  <circle cx="375.3" cy="249.4" r="48.0" fill="#FFFFFF"/>
</svg>
